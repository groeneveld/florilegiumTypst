name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pdfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: typst-community/setup-typst@v4
        with:
          typst-version: ^0.14
      - name: the example documents
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: florilegium-pdfs
          path: examples/*.pdf

  sheets:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: typst-community/setup-typst@v4
        with:
          typst-version: ^0.14
      - run: pip install pillow
      - name: seeds, inks and seasons
        run: make sheets
      - uses: actions/upload-artifact@v4
        with:
          name: sheets
          path: images/
