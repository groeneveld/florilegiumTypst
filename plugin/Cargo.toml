[package]
name = "florilegium"
version = "0.1.0"
edition = "2021"
description = "florilegium's drawing core as a Typst plugin: procedural Delft-blue margins as PDF pages"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-minimal-protocol = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ttf-parser = { version = "0.25", default-features = false, features = ["std", "opentype-layout"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
